# ------------------------------------------------------------------------------
# Dependabot auto-merge — reusable workflow.
#
# The logic lives here, once. Each repository only carries a small caller file
# (see examples/dependabot-auto-merge.yml).
#
# What gets merged automatically:
#   - GitHub Actions: everything (patch, minor, major);
#   - every other ecosystem: patches, and minors when `allow-minor` is true;
#   - majors outside GitHub Actions are never merged here, nor minors below 1.0
#     (0.5 to 0.8), which can break the API just as well.
#
# When: as soon as the pull request is opened and the required checks are
# green. This workflow does not look at the clock; the `schedule` in the
# repository's dependabot.yml decides when version updates are opened.
# Security updates ignore that schedule and can be merged at any time.
#
# REQUIRED in the calling repository, otherwise the merge does not wait for CI:
#   1. Settings > General > "Allow auto-merge" enabled;
#   2. a ruleset (or branch protection) with at least one required status
#      check on the target branch. `gh pr merge --auto` means "merge once the
#      REQUIRED checks pass": with no required check there is nothing to wait
#      for and the pull request is merged immediately.
#   3. no required approval for Dependabot, or the pull request waits forever.
#
# Secrets: a workflow triggered by Dependabot only sees Dependabot secrets
# (Settings > Secrets and variables > Dependabot), not Actions secrets. If the
# CI needs a secret, add it there too.
# ------------------------------------------------------------------------------

name: Dependabot auto-merge

on:
  workflow_call:
    inputs:
      merge-method:
        description: 'Merge method: squash, merge or rebase.'
        type: string
        default: squash
      allow-minor:
        description: 'Also merge minor updates (false = patches only).'
        type: boolean
        default: true

# The token of a Dependabot pull request is read-only by default: these two
# permissions are needed to enable auto-merge. The caller must grant the same,
# a called workflow cannot get more than its caller.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    # Only act on pull requests opened by Dependabot itself.
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      # Reads the pull request title, commit message and branch name to work
      # out the ecosystem, the update type and the dependency group.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Below 1.0, a minor update can break the API too: Dependabot calls 0.5
      # to 0.8 a minor, this workflow does not merge it.
      - name: Look for 0.x minor updates
        id: zero
        env:
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          minor=$(jq '[.[] | select(.updateType == "version-update:semver-minor" and ((.prevVersion // "") | test("^v?0\\.")))] | length > 0' <<<"$DEPENDENCIES")
          echo "minor=$minor" >> "$GITHUB_OUTPUT"

      # `update-type` is the HIGHEST level in the pull request: a grouped pull
      # request holding ten patches and one minor counts as "semver-minor".
      #
      # `--auto` does not merge by itself: it asks GitHub to merge once the
      # required checks pass. If CI fails, the pull request stays open.
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.package-ecosystem == 'github_actions' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (inputs.allow-minor && steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
            steps.zero.outputs.minor == 'false')
        run: gh pr merge --auto "--$MERGE_METHOD" "$PR_URL"
        env:
          MERGE_METHOD: ${{ inputs.merge-method }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
